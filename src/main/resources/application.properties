spring.application.name=chatInLove
server.port=${PORT:2026}

# ---------- Supabase PostgreSQL Connection ----------
# Supabase Connection Pooler (Region: aws-0-ap-south-1 [Mumbai], Session mode: port 5432, IPv4 compatible)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.xqvxtgihgetgrxqxaeci}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:org.daro.2004}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool - Supabase Free Tier Session Mode limit is 15
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# Direct Connection (IPv6 only - fails with UnknownHostException if network lacks IPv6):
# spring.datasource.url=jdbc:postgresql://db.xqvxtgihgetgrxqxaeci.supabase.co:5432/postgres?sslmode=require
# spring.datasource.username=postgres
# spring.datasource.password=org.daro.2004

# ---------- MySQL (Disabled) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/ChatLoveIn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Phnom_Penh
# spring.datasource.username=root
# spring.datasource.password=123
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ---------- JWT ----------
# JwtProperties must use @ConfigurationProperties(prefix = "app.jwt")
# The secret must be at least 32 characters (256 bits) for HS256
app.jwt.secret=your-super-secret-key-change-in-production-min-32-chars
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=7

# ---------- Chat ----------
# ChatProperties must use @ConfigurationProperties(prefix = "chat")
chat.group.min-invited-members=3
chat.call.ring-timeout-seconds=30
chat.call.max-active-calls-per-user=1
#location
# Path to your MaxMind GeoIP2 City database file
# super base
supabase.url=${SUPABASE_URL:https://xqvxtgihgetgrxqxaeci.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your_supabase_service_role_key_here}
supabase.bucket.name=${SUPABASE_BUCKET_NAME:data_storage}
#firebase
app.firebase.project-id=messager-5e43345
app.firebase.key=classpath:firebase-service-account.json
app.firebase.credentials-json=${APP_FIREBASE_CREDENTIALS_JSON:}
app.firebase.storage-bucket=in-love-b2ffb.firebasestorage.app

# Maximum size for a single file 
spring.servlet.multipart.max-file-size=10MB

# Maximum size for the overall multipart/form-data request
spring.servlet.multipart.max-request-size=10MB

# ---------- Local uploads ----------
# Folder that is served publicly under /uploads/**
app.upload.dir=./uploads/

# ---------- Device location ----------
# The location of a device may be sent in the request body, in these headers,
# or split across both. The body wins for any field it supplies.
app.location.latitude-headers=X-Device-Latitude,X-Latitude,X-Geo-Latitude,X-Client-Latitude
app.location.longitude-headers=X-Device-Longitude,X-Longitude,X-Geo-Longitude,X-Client-Longitude
app.location.city-headers=X-Device-City,X-City
app.location.country-headers=X-Device-Country,X-Country
app.location.device-name-header=X-Device-Name
app.location.device-type-header=X-Device-Type
# ---------- Logging ----------
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
location.autodetect-private-ip=true

# ---------- Public uptime health check ----------
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health
