# -----------------------------------------------------------------------------
# Test configuration
# -----------------------------------------------------------------------------
# The tests must NEVER touch the production database. The default
# src/main/resources/application.properties points at the Supabase instance and
# the Flyway migrations would be applied to it on every test run - the
# context-load test therefore uses an embedded H2 database instead.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:chatlove_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# No migrations in the tests - the schema is created by Hibernate.
spring.flyway.enabled=false

# Placeholders that the application context needs (dummy values).
supabase.url=https://test.supabase.co
supabase.service-role-key=test-service-role-key
supabase.bucket.name=test-bucket
app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.firebase.project-id=test-project
app.firebase.key=classpath:firebase-service-account.json
app.firebase.credentials-json=
app.firebase.storage-bucket=test-bucket
app.upload.dir=./target/uploads/
chat.group.min-invited-members=3
chat.call.ring-timeout-seconds=30
chat.call.max-active-calls-per-user=1

# Keep the console quiet.
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
